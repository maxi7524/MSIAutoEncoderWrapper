# Predictive autoencoder ablation campaign on the composed kidney MSI image.
#
# The public strategy names below are resolved by the runtime. Every paired
# ablation differs only in its objective configuration and run seed.

schema_version: 1

experiment:
  name: kidney-architecture-predictive

task:
  entrypoint: msi_autoencoder_wrapper.runtime.workflows.wrapper:run_wrapper_training
  preflight_entrypoint: msi_autoencoder_wrapper.runtime.workflows.wrapper:preflight_wrapper_training
  test_entrypoint: msi_autoencoder_wrapper.runtime.workflows.wrapper:test_wrapper_training
  plan_entrypoint: msi_autoencoder_wrapper.runtime.workflows.configured:resolve_single_image_campaign
  parameters:
    factory: msi_autoencoder_wrapper.runtime.workflows.configured:build_single_image_autoencoder
    factory_parameters:
      project_path: data/kidney_workspace
      project_path_anchor: repository
      image_path: datasets/kidney/kidney.imzML
      device: null
      reader:
        strategy: PyImzMLReader
        parameters: {}
      annotations:
        # Resolve the sibling kidney.sqlite annotation store during planning.
        strategy: auto
        parameters: {}
      binning:
        strategy: LinearBinning
        parameters:
          bin_step: 0.55
          x_min: 200.0
          x_max: 900.0
          aggregation: sum
      inverse_binning:
        strategy: PassthroughInverseBinner
      dataset:
        strategy: PixelDataset
        parameters:
          source: image
          normalization: tic
          target_specs:
            molecule:
              type: multi_label
          # Preserve the source-dataset proportions in the development subset.
          subset:
            fraction: 0.1
            seed: 42
            method: stratified_random
            parameters:
              group_fields: dataset_id
          # Whole source datasets, rather than neighbouring pixels, are assigned
          # to one split. The grouped allocator approximates the requested sample
          # fractions using complete dataset groups.
          split:
            strategy: grouped
            fractions:
              train: 0.7
              validation: 0.15
              test: 0.15
            parameters:
              group_fields: dataset_id
      variant:
        grid: architectures
      predictive:
        projector:
          strategy: LinearProjector
          parameters:
            latent_dim: 10
            projection_dim: 64
        heads:
          molecule_primary:
            target_field: molecule
            strategy: LinearClassificationHead
            parameters:
              latent_dim: 10
              # Resolve from PixelDataset.get_class_mappings() during planning.
              output_dim: auto_from_target
              hidden_dim: 128
              dropout: 0.1
    model_name: null
    training:
      patience: 10
      continuation:
        enabled: true
        resume: true
        checkpoint_every_epochs: 1
      checkpoint:
        enabled: true
        restore_best: true
      phases:
        # Reconstruction, representation regularization, contrastive invariance,
        # and molecular prediction are optimized jointly in one phase.
        - phase_name: joint_predictive
          epochs: 15
          batch_size: 64
          gradient_clip_norm: 5.0
          optimizer:
            type: AdamW
            params:
              lr: 0.001
              weight_decay: 0.0001
          criterions:
            grid: objectives

runs:
  repetitions: 5

seeds:
  common_seeds:
    split: 42
    dataloader: 43
  run_seeds:
    model_initialization: 1000
    training: 2000

grid:
  architectures:
    values:
      - name: mlp-ae-512-256-latent-10-layernorm
        preset: MLPAutoencoder
        parameters:
          latent_dim: 10
          encoder_hidden_dims: [512, 256]
          decoder_hidden_dims: [256, 512]
          # LayerNorm keeps enc(x) independent of the composition of a batch,
          # which is required for a per-spectrum Jacobian interpretation.
          normalization: layer

  # Seven paired ablations x five repetitions = 35 tasks.
  objectives:
    values:
      - reconstruction:
          masserstein:
            target: MassersteinLoss
            weight: 1.0
        heads: &molecule_head_loss
          molecule_primary:
            balanced_bce:
              target: ClassBalancedMultiLabelBCELoss
              weight: 0.2
              params: &balanced_bce_params
                # Equalize total positive and negative contributions per class
                # from training-partition counts: pos_weight[c] = N_neg[c] / N_pos[c].
                class_balance_method: train_inverse_prevalence
                max_positive_weight: 20.0
                reduction: balanced_class_mean
                unknown_label_policy: assume_negative

      - reconstruction:
          masserstein:
            target: MassersteinLoss
            weight: 1.0
        regularization:
          contractive:
            target: ContractiveLoss
            weight: 0.001
            params: &contractive_params
              # Supported public methods:
              # - exact_autograd_jacobian: exact, intended for verification and
              #   small input/latent dimensions;
              # - approximate_hutchinson_vjp: unbiased stochastic estimate of
              #   the local Jacobian Frobenius norm without storing B x D x M.
              calculation_method: approximate_hutchinson_vjp
              num_probes: 5
              probe_distribution: rademacher
              latent_source: auto
        heads: *molecule_head_loss

      - reconstruction:
          masserstein:
            target: MassersteinLoss
            weight: 1.0
        contrastive:
          peak_permutation:
            target: InfoNCELoss
            weight: 0.1
            params:
              # permutation_random ignores annotations and cyclically permutes
              # bounded, train-precomputed envelopes inside each spectrum.
              peak_selection_method: permutation_random
              temperature: 0.07
              peak_sample_size: 1000
              peak_catalog_limit: 4096
              permuted_peaks_per_view: 8
              preserve_input_normalization: true
        heads: *molecule_head_loss

      - reconstruction:
          masserstein:
            target: MassersteinLoss
            weight: 1.0
        contrastive: &label_invariant_contrastive
          peak_permutation:
            target: InfoNCELoss
            weight: 0.1
            params:
              # permutation_label_invariant resolves protected regions separately
              # for every spectrum:
              # spectrum_id -> source dataset -> pixel labels -> label m/z values
              # -> protected binner intervals. Only non-intersecting envelopes
              # may be permuted between batch rows.
              peak_selection_method: permutation_label_invariant
              temperature: 0.07
              peak_sample_size: 1000
              peak_catalog_limit: 4096
              permuted_peaks_per_view: 8
              annotation_tolerance: 3.0
              annotation_tolerance_unit: ppm
              preserve_input_normalization: true
        heads: *molecule_head_loss

      - reconstruction:
          masserstein:
            target: MassersteinLoss
            weight: 1.0
        regularization:
          contractive:
            target: ContractiveLoss
            weight: 0.001
            params: *contractive_params
        contrastive: *label_invariant_contrastive
        heads: *molecule_head_loss

      - reconstruction:
          masserstein:
            target: MassersteinLoss
            weight: 1.0
        regularization:
          contractive:
            target: ContractiveLoss
            weight: 0.001
            params: *contractive_params
        contrastive:
          peak_permutation:
            target: InfoNCELoss
            weight: 0.1
            params:
              peak_selection_method: permutation_label_invariant
              temperature: 0.07
              peak_sample_size: 1000
              peak_catalog_limit: 4096
              permuted_peaks_per_view: 8
              annotation_tolerance: 3.0
              annotation_tolerance_unit: ppm
              preserve_input_normalization: true
              # Samples sharing labels remain negatives, but their contribution
              # to the InfoNCE denominator is reduced according to label overlap.
              negative_weighting_method: multilabel_jaccard
              overlapping_label_negative_weight: 0.25
        heads: *molecule_head_loss

      - reconstruction:
          masserstein:
            target: MassersteinLoss
            weight: 1.0
        regularization:
          contractive:
            target: ContractiveLoss
            weight: 0.001
            params: *contractive_params
        contrastive: *label_invariant_contrastive
        heads:
          molecule_primary:
            nnpu:
              target: NNPUMultiLabelLoss
              weight: 0.2
              params:
                # Zeros are unlabelled samples rather than verified negatives.
                # Observed train prevalence is scaled as an explicit initial
                # prior assumption and clipped away from zero and one.
                prior_method: scaled_train_observed
                prior_multiplier: 1.5
                min_prior: 0.0001
                max_prior: 0.99

execution:
  backend: local
  max_parallel_runs: 1

reports: []

reporting:
  continue_on_error: true
