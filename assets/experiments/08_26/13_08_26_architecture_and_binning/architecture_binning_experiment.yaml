# Architecture comparison on one MSI dataset: 3 architectures x 4 bin widths x 5 repetitions.
# `project_path` is resolved from the explicit anchor below, never from this YAML's location.

schema_version: 1

experiment:
  name: kidney-architecture-binning

task:
  # `entrypoint` executes one already-resolved task. `preflight_entrypoint`
  # constructs only the first task and checks the complete pipeline before launch.
  entrypoint: msi_autoencoder_wrapper.runtime.workflows.wrapper:run_wrapper_training
  preflight_entrypoint: msi_autoencoder_wrapper.runtime.workflows.wrapper:preflight_wrapper_training
  test_entrypoint: msi_autoencoder_wrapper.runtime.workflows.wrapper:test_wrapper_training
  # PLAN RESOLVER: materializes full encoder/decoder, binner, and split artifacts.
  # Training tasks reference these files and do not execute architecture presets.
  plan_entrypoint: msi_autoencoder_wrapper.runtime.workflows.configured:resolve_single_image_campaign
  parameters:
    factory: msi_autoencoder_wrapper.runtime.workflows.configured:build_single_image_autoencoder
    factory_parameters:
      # Workspace root. Keep this readable; `repository` means the repository root.
      project_path: data/kidney_workspace
      project_path_anchor: repository
      # Dataset path is relative to `project_path`.
      image_path: datasets/kidney/kidney.imzML
      device: null
      reader:
        # Avoid M2aia's multi-minute native normalization-image initialization.
        # PyImzML opens promptly but reads spectrum batches through Python, so it
        # trades startup cost for lower per-batch throughput.
        strategy: PyImzMLReader
        parameters: {}
      binning:
        strategy: LinearBinning
        parameters:
          bin_step:
            grid: binning_steps
          x_min: 200.0
          x_max: 900.0
          aggregation: sum
      # The inverse binner is resolved once per forward-binning grid and stored
      # in the shared context configuration used by every matching task.
      inverse_binning:
        strategy: PassthroughInverseBinner
      dataset:
        strategy: PixelDataset
        parameters:
          source: image
          normalization: tic
          target_specs: {}
          subset:
            fraction: 0.1
            seed: 42
            method: stratified_random
          split:
            strategy: random
            fractions:
              train: 0.8
              validation: 0.1
              test: 0.1
      variant:
        grid: architectures
    model_name: null
    training:
      patience: 10
      # Runtime continuation checkpoint. This is separate from the best-model
      # checkpoint below and stores optimizer plus random-state information.
      continuation:
        enabled: true
        resume: true
        checkpoint_every_epochs: 1
      checkpoint:
        enabled: true
        restore_best: true
      phases:
        - phase_name: reconstruction
          epochs: 10
          batch_size: 64
          optimizer:
            type: AdamW
            params:
              lr: 0.001
              weight_decay: 0.0001
          criterions:
            reconstruction:
              masserstein:
                target: "MassersteinLoss"
                weight: 1.0

runs:
  repetitions: 5

seeds:
  # These remain fixed across every repetition and every grid cell.
  common_seeds:
    # Train/validation/test assignments.
    split: 42
    # Shuffle order of the training DataLoader.
    dataloader: 43
  # These are deterministically derived again for every repetition.
  run_seeds:
    # Weight initialization before the model is constructed.
    model_initialization: 1000
    # Training-time random operations after the model exists.
    training: 2000

# Cartesian grid: 4 bin widths x 3 architectures = 12 grid cells.
# Each cell is repeated 5 times, producing 60 independent tasks.
grid:
  binning_steps:
    values: [0.45, 0.5, 0.55, 1.0]
  architectures:
    values:
    - name: mlp-ae-512-latent-10
      preset: MLPAutoencoder
      parameters:
        latent_dim: 10
        encoder_hidden_dims: [512]
        decoder_hidden_dims: [512]
        batch_normalization: true
    - name: mlp-ae-512-256-latent-10
      preset: MLPAutoencoder
      parameters:
        latent_dim: 10
        encoder_hidden_dims: [512, 256]
        decoder_hidden_dims: [256, 512]
        batch_normalization: true
    - name: conv1d-ae-32-16-8-latent-10
      preset: CNNAutoencoder
      parameters:
        latent_dim: 10
        channels: [1, 32, 16, 8]
        kernels: [7, 5, 3]
        strides: [3, 3, 3]

execution:
  # With `max_parallel_runs: 1`, all 60 tasks reuse one initialized reader in the
  # local process. Raising this value creates that many independent reader handles.
  backend: local
  max_parallel_runs: 1
  # No work_directory override: artifacts go to the declared workspace under
  # configs/execution/<experiment.name>; trained models go under workspace/models.

reports: []

reporting:
  continue_on_error: true
