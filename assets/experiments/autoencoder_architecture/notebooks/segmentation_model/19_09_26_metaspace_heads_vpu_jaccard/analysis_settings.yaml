    tags: {family: vpu, contrastive: true, contractive: true, temperature: 0.07, weight: 0.001, jaccard_weight: 0.1}
    visualization: {order: 13, color: "#0072B2", line_style: dashed, marker: "o"}
  vpu_contractive_contrastive_t007_w1m_j25:
    display_label: "VPU + contractive + contrastive (T=0.07, w=0.001, j=0.25)"
    select: {source: vpu_jaccard_shortlist, grid_id: grid_0010}
