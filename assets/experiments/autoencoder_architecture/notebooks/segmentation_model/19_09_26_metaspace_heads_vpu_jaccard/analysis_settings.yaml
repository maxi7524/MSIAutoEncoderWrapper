    display_label: "VPU + contrastive (T=0.01, w=0.001, j=0.1)"
    select: {source: vpu_jaccard_shortlist, grid_id: grid_0006}
    tags: {family: vpu, contrastive: true, contractive: false, temperature: 0.01, weight: 0.001, jaccard_weight: 0.1}
    visualization: {order: 9, color: "#009E73", line_style: solid, marker: "o"}
  vpu_contrastive_t001_w1m_j25:
    display_label: "VPU + contrastive (T=0.01, w=0.001, j=0.25)"
    select: {source: vpu_jaccard_shortlist, grid_id: grid_0007}
    tags: {family: vpu, contrastive: true, contractive: false, temperature: 0.01, weight: 0.001, jaccard_weight: 0.25}
    visualization: {order: 10, color: "#009E73", line_style: solid, marker: "s"}
  vpu_contrastive_t001_w1m_j50:
