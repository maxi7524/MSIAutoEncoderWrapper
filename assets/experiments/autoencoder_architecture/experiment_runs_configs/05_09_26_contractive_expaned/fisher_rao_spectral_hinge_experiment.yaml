# Fisher--Rao versus Euclidean spectral sensitivity on TIC-normalized spectra.
# 13 objective configurations x 5 repetitions = 65 training tasks.
# Hinge thresholds are provisional placeholders. Replace them after baseline
# calibration from the chosen quantiles of each geometry's spectral sensitivity.

schema_version: 1

experiment:
  name: kidney-fisher-rao-spectral-hinge

task:
  entrypoint: msi_autoencoder_wrapper.runtime.workflows.wrapper:run_wrapper_training
  preflight_entrypoint: msi_autoencoder_wrapper.runtime.workflows.wrapper:preflight_wrapper_training
  test_entrypoint: msi_autoencoder_wrapper.runtime.workflows.wrapper:test_wrapper_training
  plan_entrypoint: msi_autoencoder_wrapper.runtime.workflows.configured:resolve_single_image_campaign
  parameters:
    factory: msi_autoencoder_wrapper.runtime.workflows.configured:build_single_image_autoencoder
    factory_parameters:
      project_path: data/kidney_workspace
      project_path_anchor: repository
      image_path: datasets/kidney/kidney.imzML
      device: null
      reader:
        strategy: PyImzMLReader
        parameters: {}
      annotations:
        strategy: auto
        parameters: {}
      binning:
        strategy: LinearBinning
        parameters:
          bin_step: 0.55
          x_min: 200.0
          x_max: 900.0
          aggregation: sum
      inverse_binning:
        strategy: PassthroughInverseBinner
      dataset:
        strategy: PixelDataset
        parameters:
          source: image
          normalization: tic
          target_specs:
            molecule:
              type: multi_label
          annotation_settings:
            mapping:
              x_mapping: binner
            selection:
              annotated_fraction: 1.0
              unannotated_fraction: 0.0
              max_unannotated_to_annotated_ratio: 0.0
              seed: 42
            targets:
              molecule:
                empty_spectrum_policy: exclude
                unobserved_label_policy: unlabelled
                add_annotation_presence_target: false
          subset:
            fraction: 0.1
            seed: 42
            method: proportional_multilabel
            parameters:
              group_fields: dataset_id
              minimum_positive_count: 3
          split:
            strategy: proportional_multilabel
            fractions:
              train: 0.8
              validation: 0.1
              test: 0.1
            parameters:
              group_fields: dataset_id
              minimum_positive_per_split: 1
      variant:
        grid: architectures
      predictive:
        projector:
          strategy: LinearProjector
          parameters:
            latent_dim: 10
            projection_dim: 64
        heads:
          molecule_primary:
            target_field: molecule
            strategy: LinearClassificationHead
            parameters:
              latent_dim: 10
              output_dim: auto_from_target
              hidden_dim: 128
              dropout: 0.1
    model_name: null
    training:
      patience: 10
      continuation:
        enabled: true
        resume: true
        checkpoint_every_epochs: 1
      checkpoint:
        enabled: true
        restore_best: true
      phases:
        - phase_name: joint_predictive
          epochs: 15
          batch_size: 64
          gradient_clip_norm: 5.0
          optimizer:
            type: AdamW
            params:
              lr: 0.001
              weight_decay: 0.0001
          criterions:
            grid: objectives

runs:
  repetitions: 5

seeds:
  common_seeds:
    split: 42
    dataloader: 43
  run_seeds:
    model_initialization: 1000
    training: 2000

grid:
  architectures:
    values:
      - name: conv1d-ae-32-16-8-latent-10
        preset: CNNAutoencoder
        parameters:
          latent_dim: 10
          channels: [1, 32, 16, 8]
          kernels: [5, 7, 3]
          strides: [3, 3, 3]
          output_normalization:
            type: tic
            parameters:
              epsilon: 1.0e-12

  objectives:
    values:
      - reconstruction: &reconstruction
          masserstein:
            target: MassersteinLoss
            weight: 1.0
        heads: &molecule_head_loss
          molecule_primary:
            balanced_bce:
              target: ClassBalancedMultiLabelBCELoss
              weight: 0.2
              params:
                class_balance_method: train_inverse_prevalence
                max_positive_weight: 20.0
                reduction: balanced_class_mean
                unknown_label_policy: assume_negative
        regularization:
          contractive: &fisher_spectral
            target: ContractiveLoss
            # TODO: Replace after baseline Fisher/Euclidean scale calibration.
            weight: 1.0e-5
            params: &fisher_spectral_params
              calculation_method: approximate_hutchinson_vjp
              num_probes: 5
              probe_distribution: rademacher
              latent_source: auto
              penalty_metric: spectral
              penalized_space: u
              input_geometry: fisher_rao

      # TODO: Replace threshold placeholders with geometry-specific baseline
      # quantiles, and replace weight after Fisher spectral scale calibration.
      - reconstruction: *reconstruction
        heads: *molecule_head_loss
        regularization:
          contractive: &fisher_hinge_tau_005_alpha_05
            <<: *fisher_spectral
            params:
              <<: *fisher_spectral_params
              penalty_metric: spectral_plus_hinged
              hinge_threshold: 0.05
              hinge_alpha: 0.5
      - reconstruction: *reconstruction
        heads: *molecule_head_loss
        regularization:
          contractive: &fisher_hinge_tau_005_alpha_10
            <<: *fisher_hinge_tau_005_alpha_05
            params:
              <<: *fisher_spectral_params
              penalty_metric: spectral_plus_hinged
              hinge_threshold: 0.05
              hinge_alpha: 1.0
      - reconstruction: *reconstruction
        heads: *molecule_head_loss
        regularization:
          contractive: &fisher_hinge_tau_010_alpha_05
            <<: *fisher_hinge_tau_005_alpha_05
            params:
              <<: *fisher_spectral_params
              penalty_metric: spectral_plus_hinged
              hinge_threshold: 0.10
              hinge_alpha: 0.5
      - reconstruction: *reconstruction
        heads: *molecule_head_loss
        regularization:
          contractive: &fisher_hinge_tau_010_alpha_10
            <<: *fisher_hinge_tau_005_alpha_05
            params:
              <<: *fisher_spectral_params
              penalty_metric: spectral_plus_hinged
              hinge_threshold: 0.10
              hinge_alpha: 1.0
      - reconstruction: *reconstruction
        heads: *molecule_head_loss
        regularization:
          contractive: &fisher_hinge_tau_020_alpha_05
            <<: *fisher_hinge_tau_005_alpha_05
            params:
              <<: *fisher_spectral_params
              penalty_metric: spectral_plus_hinged
              hinge_threshold: 0.20
              hinge_alpha: 0.5
      - reconstruction: *reconstruction
        heads: *molecule_head_loss
        regularization:
          contractive: &fisher_hinge_tau_020_alpha_10
            <<: *fisher_hinge_tau_005_alpha_05
            params:
              <<: *fisher_spectral_params
              penalty_metric: spectral_plus_hinged
              hinge_threshold: 0.20
              hinge_alpha: 1.0

      - reconstruction: *reconstruction
        heads: *molecule_head_loss
        regularization:
          contractive: &euclidean_hinge_tau_005_alpha_05
            <<: *fisher_spectral
            # TODO: Replace after Euclidean spectral scale calibration.
            weight: 1.0e-5
            params: &euclidean_hinge_base_params
              <<: *fisher_spectral_params
              input_geometry: euclidean
              penalty_metric: spectral_plus_hinged
              hinge_threshold: 0.05
              hinge_alpha: 0.5
      - reconstruction: *reconstruction
        heads: *molecule_head_loss
        regularization:
          contractive:
            <<: *euclidean_hinge_tau_005_alpha_05
            params:
              <<: *euclidean_hinge_base_params
              hinge_alpha: 1.0
      - reconstruction: *reconstruction
        heads: *molecule_head_loss
        regularization:
          contractive:
            <<: *euclidean_hinge_tau_005_alpha_05
            params:
              <<: *euclidean_hinge_base_params
              hinge_threshold: 0.10
              hinge_alpha: 0.5
      - reconstruction: *reconstruction
        heads: *molecule_head_loss
        regularization:
          contractive:
            <<: *euclidean_hinge_tau_005_alpha_05
            params:
              <<: *euclidean_hinge_base_params
              hinge_threshold: 0.10
              hinge_alpha: 1.0
      - reconstruction: *reconstruction
        heads: *molecule_head_loss
        regularization:
          contractive:
            <<: *euclidean_hinge_tau_005_alpha_05
            params:
              <<: *euclidean_hinge_base_params
              hinge_threshold: 0.20
              hinge_alpha: 0.5
      - reconstruction: *reconstruction
        heads: *molecule_head_loss
        regularization:
          contractive:
            <<: *euclidean_hinge_tau_005_alpha_05
            params:
              <<: *euclidean_hinge_base_params
              hinge_threshold: 0.20
              hinge_alpha: 1.0

execution:
  backend: local
  max_parallel_runs: 1

reports: []

reporting:
  continue_on_error: true
