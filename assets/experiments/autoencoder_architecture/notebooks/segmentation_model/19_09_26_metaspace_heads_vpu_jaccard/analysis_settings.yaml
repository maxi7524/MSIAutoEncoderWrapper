target_field: molecule
device: cuda
batch_size: 2000
pixel_fraction: 1.0
sample_seed: 42
geometry_sample_size: 512
neighbours: 10
probe_penalty: 0.01
expected_seeds: 5
evidence:
  absolute_threshold: 0.0
  relative_threshold: 0.0119
  bin_radius: 1
path_remap: {}
planned_epochs: 15

analyses:
  campaign_training_dynamics:
    output_directory: assets/experiments/autoencoder_architecture/notebooks/segmentation_model/19_09_26_metaspace_heads_vpu_jaccard/part_0_0_campaign_training_dynamics_results
  reconstruction_local:
    selected_models:
      # - vpu_contrastive_t030_w10m
      # - vpu_contrastive_t030_w10m_j10
      # - vpu_contrastive_t030_w10m_j25
      # - vpu_contrastive_t030_w10m_j50
      # - vpu_contrastive_t007_w10m
      # - vpu_contrastive_t007_w10m_j10
      # - vpu_contrastive_t007_w10m_j25
      # - vpu_contrastive_t007_w10m_j50
      # - vpu_contrastive_t001_w1m
      # - vpu_contrastive_t001_w1m_j10
      # - vpu_contrastive_t001_w1m_j25
      # - vpu_contrastive_t001_w1m_j50
      - vpu_contractive_contrastive_t007_w1m
      # - vpu_contractive_contrastive_t007_w1m_j10
      # - vpu_contractive_contrastive_t007_w1m_j25
      - vpu_contractive_contrastive_t007_w1m_j50
    repetition: 0
    sample_pixels: 2000
    cases_per_category: 2
    top_k: 10
    display_amplitudes: [0.0, 0.1, 0.5, 1.0]
    curve_amplitudes: [0.0, 0.05, 0.1, 0.25, 0.5, 0.75, 1.0]
    perturbation:
      shift_bins: 1
      extra_width_sigma: 1.0
      base_width_sigma: 0.42
      lognormal_sigma: 0.05
      noise_fraction: 0.02
    output_directory: assets/experiments/autoencoder_architecture/notebooks/segmentation_model/19_09_26_metaspace_heads_vpu_jaccard/part_1_reconstruction_local_results
  reconstruction_global:
    evaluation_split: test
    global_perturbation_amplitudes: [0.0, 1.0]
    global_perturbation_sample_pixels: 500
    perturbation:
      shift_bins: 1
      extra_width_sigma: 1.0
      base_width_sigma: 0.42
      lognormal_sigma: 0.05
      noise_fraction: 0.02
    output_directory: assets/experiments/autoencoder_architecture/notebooks/segmentation_model/19_09_26_metaspace_heads_vpu_jaccard/part_2_reconstruction_global_results
  latent_geometry:
    evaluation_split: test
    pair_count: 5000
    epsilons: [0.001, 0.003, 0.01, 0.03, 0.1]
