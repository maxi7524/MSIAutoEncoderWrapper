# Final Jaccard-weighted comparison of four selected VPU objectives.
# Four objectives x three Jaccard weights x five repetitions = 60 training tasks.
# The selected temperatures and contrastive weights follow the predictive and
# reconstruction ranking; the fourth objective also includes the selected
# Fisher--Rao spectral hinge contractive regularizer.

schema_version: 1

experiment:
  name: kidney-vpu-jaccard-shortlist

task:
  entrypoint: msi_autoencoder_wrapper.runtime.workflows.wrapper:run_wrapper_training
  preflight_entrypoint: msi_autoencoder_wrapper.runtime.workflows.wrapper:preflight_wrapper_training
  test_entrypoint: msi_autoencoder_wrapper.runtime.workflows.wrapper:test_wrapper_training
  plan_entrypoint: msi_autoencoder_wrapper.runtime.workflows.configured:resolve_single_image_campaign
  parameters:
    factory: msi_autoencoder_wrapper.runtime.workflows.configured:build_single_image_autoencoder
    factory_parameters:
      project_path: data/kidney_workspace
      project_path_anchor: repository
      image_path: datasets/kidney/kidney.imzML
      device: null
      reader:
        strategy: PyImzMLReader
        parameters: {}
      annotations:
        strategy: auto
        parameters: {}
      binning:
        strategy: LinearBinning
        parameters:
          bin_step: 0.55
          x_min: 200.0
          x_max: 900.0
          aggregation: sum
      inverse_binning:
        strategy: PassthroughInverseBinner
      dataset:
        strategy: PixelDataset
        parameters:
          source: image
          normalization: tic
          target_specs:
            molecule:
              type: multi_label
          annotation_settings:
            mapping:
              x_mapping: binner
            selection:
              annotated_fraction: 1.0
              unannotated_fraction: 0.0
              max_unannotated_to_annotated_ratio: 0.0
              seed: 42
            targets:
              molecule:
                empty_spectrum_policy: exclude
                unobserved_label_policy: unlabelled
                add_annotation_presence_target: false
          subset:
            fraction: 0.1
            seed: 42
            method: proportional_multilabel
            parameters:
              group_fields: dataset_id
              minimum_positive_count: 3
          split:
            strategy: proportional_multilabel
            fractions: {train: 0.8, validation: 0.1, test: 0.1}
            parameters:
              group_fields: dataset_id
              minimum_positive_per_split: 1
      variant:
        grid: architectures
      predictive:
        projector:
          strategy: LinearProjector
          parameters: {latent_dim: 10, projection_dim: 64}
        heads:
          molecule_vpu:
            target_field: molecule
            strategy: LinearClassificationHead
            parameters:
              latent_dim: 10
              output_dim: auto_from_target
              hidden_dim: 128
              dropout: 0.1
    model_name: null
    training:
      patience: 10
      continuation:
        enabled: true
        resume: true
        checkpoint_every_epochs: 1
      checkpoint:
        enabled: true
        restore_best: true
      phases:
        - phase_name: joint_predictive
          epochs: 15
          batch_size: 64
          gradient_clip_norm: 5.0
          supervision_sampling:
            target_field: molecule
            proportions: {positive: 1, unlabelled: 1}
            replacement: true
            seed: 43
          optimizer:
            type: AdamW
            params: {lr: 0.001, weight_decay: 0.0001}
          criterions:
            grid: objectives

runs:
  repetitions: 5

seeds:
  common_seeds: {split: 42, dataloader: 43}
  run_seeds: {model_initialization: 1000, training: 2000}

grid:
  architectures:
    values:
      - name: conv1d-ae-32-16-8-latent-10
        preset: CNNAutoencoder
        parameters:
          latent_dim: 10
          channels: [1, 32, 16, 8]
          kernels: [5, 7, 3]
          strides: [3, 3, 3]
          output_normalization:
            type: tic
            parameters: {epsilon: 1.0e-12}

  objectives:
    values:
      # VPU + contrastive, T=0.30, w=0.01.
      - reconstruction: &masserstein
          masserstein: {target: MassersteinLoss, weight: 1.0}
        heads: &vpu_heads
          molecule_vpu:
            vpu_alpha_1_beta_1:
              target: VariationalPULoss
              weight: 0.2
              params: {alpha: 1.0, beta: 1.0, consistency_weight: 0.0, negative_weight: 0.0, simulated_negative_weight: 0.0}
        contrastive:
          peak_permutation: &t030_w001
            target: InfoNCELoss
            weight: 0.01
            params: &t030_params
              peak_selection_method: permutation_label_invariant
              temperature: 0.30
              peak_sample_size: 10000
              peak_catalog_limit: 4096
              permutation_bank_size: 7000
              permuted_peaks_per_view: 3
              permutation_selection_attempts: 64
              annotation_bin_radius: 0
              preserve_input_normalization: true
              negative_weighting_method: multilabel_jaccard
              overlapping_label_negative_weight: 0.1
      - reconstruction: *masserstein
        heads: *vpu_heads
        contrastive:
          peak_permutation:
            <<: *t030_w001
            params:
              <<: *t030_params
              overlapping_label_negative_weight: 0.25
      - reconstruction: *masserstein
        heads: *vpu_heads
        contrastive:
          peak_permutation:
            <<: *t030_w001
            params:
              <<: *t030_params
              overlapping_label_negative_weight: 0.5

      # VPU + contrastive, T=0.07, w=0.01.
      - reconstruction: *masserstein
        heads: *vpu_heads
        contrastive:
          peak_permutation: &t007_w001
            target: InfoNCELoss
            weight: 0.01
            params: &t007_w001_params
              peak_selection_method: permutation_label_invariant
              temperature: 0.07
              peak_sample_size: 10000
              peak_catalog_limit: 4096
              permutation_bank_size: 7000
              permuted_peaks_per_view: 3
              permutation_selection_attempts: 64
              annotation_bin_radius: 0
              preserve_input_normalization: true
              negative_weighting_method: multilabel_jaccard
              overlapping_label_negative_weight: 0.1
      - reconstruction: *masserstein
        heads: *vpu_heads
        contrastive:
          peak_permutation:
            <<: *t007_w001
            params:
              <<: *t007_w001_params
              overlapping_label_negative_weight: 0.25
      - reconstruction: *masserstein
        heads: *vpu_heads
        contrastive:
          peak_permutation:
            <<: *t007_w001
            params:
              <<: *t007_w001_params
              overlapping_label_negative_weight: 0.5

      # VPU + contrastive, T=0.01, w=0.001.
      - reconstruction: *masserstein
        heads: *vpu_heads
        contrastive:
          peak_permutation: &t001_w0001
            target: InfoNCELoss
            weight: 0.001
            params: &t001_w0001_params
              peak_selection_method: permutation_label_invariant
              temperature: 0.01
              peak_sample_size: 10000
              peak_catalog_limit: 4096
              permutation_bank_size: 7000
              permuted_peaks_per_view: 3
              permutation_selection_attempts: 64
              annotation_bin_radius: 0
              preserve_input_normalization: true
              negative_weighting_method: multilabel_jaccard
              overlapping_label_negative_weight: 0.1
      - reconstruction: *masserstein
        heads: *vpu_heads
        contrastive:
          peak_permutation:
            <<: *t001_w0001
            params:
              <<: *t001_w0001_params
              overlapping_label_negative_weight: 0.25
      - reconstruction: *masserstein
        heads: *vpu_heads
        contrastive:
          peak_permutation:
            <<: *t001_w0001
            params:
              <<: *t001_w0001_params
              overlapping_label_negative_weight: 0.5

      # VPU + contractive + contrastive, T=0.07, w=0.001.
      - reconstruction: *masserstein
        heads: *vpu_heads
        regularization: &fisher_spectral_hinge
          contractive:
            target: ContractiveLoss
            weight: 2.0e-3
            params: &fisher_spectral_hinge_params
              calculation_method: exact_autograd_jacobian
              latent_source: auto
              penalty_metric: spectral_plus_hinged
              penalized_space: u
              input_geometry: fisher_rao
              hinge_threshold: 7.0
              hinge_alpha: 2.0
        contrastive:
          peak_permutation: &t007_w0001
            target: InfoNCELoss
            weight: 0.001
            params: &t007_w0001_params
              peak_selection_method: permutation_label_invariant
              temperature: 0.07
              peak_sample_size: 10000
              peak_catalog_limit: 4096
              permutation_bank_size: 7000
              permuted_peaks_per_view: 3
              permutation_selection_attempts: 64
              annotation_bin_radius: 0
              preserve_input_normalization: true
              negative_weighting_method: multilabel_jaccard
              overlapping_label_negative_weight: 0.1
      - reconstruction: *masserstein
        heads: *vpu_heads
        regularization: *fisher_spectral_hinge
        contrastive:
          peak_permutation:
            <<: *t007_w0001
            params:
              <<: *t007_w0001_params
              overlapping_label_negative_weight: 0.25
      - reconstruction: *masserstein
        heads: *vpu_heads
        regularization: *fisher_spectral_hinge
        contrastive:
          peak_permutation:
            <<: *t007_w0001
            params:
              <<: *t007_w0001_params
              overlapping_label_negative_weight: 0.5

execution:
  backend: local
  max_parallel_runs: 1
  entropy:
    task_walltime: 01:00:00

reports: []
reporting:
  continue_on_error: true
