  vpu_contrastive_t007_w10m_j50:
    display_label: "VPU + contrastive (T=0.07, w=0.01, j=0.5)"
    select: {source: vpu_jaccard_shortlist, grid_id: grid_0005}
    tags: {family: vpu, contrastive: true, contractive: false, temperature: 0.07, weight: 0.01, jaccard_weight: 0.5}
