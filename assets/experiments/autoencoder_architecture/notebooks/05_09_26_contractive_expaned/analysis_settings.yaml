# Settings for the contractive-penalty analyses in this directory.
# Paths are relative to the repository root; absolute paths are also accepted.
#
# Every notebook here reads precomputed tables rather than computing them. Produce a
# table set with:
#   python -m msi_autoencoder_wrapper.analysis.autoencoder.experiments.contractive_precompute \
#       --settings assets/experiments/autoencoder_architecture/notebooks/05_09_26_contractive_expaned/analysis_settings.yaml \
#       --analysis <name>
# Each notebook prints its own copy-pasteable command, including the nohup form.

workspace: data/kidney_workspace
model_store: data/kidney_workspace/models/kidney
model_context: kidney

# Saved model configurations record the compute node's absolute reader paths. This root
# is linked to the local workspace so the single `load_configuration` call can resolve
# them; see sweep_evaluation.link_campaign_scratch_workspace.
scratch_workspace_root: /tmp/ms488923/msi-wrapper

# Decoding a split from the raw reader is the slowest single step, so decoded splits are
# cached here and shared by every analysis and every model.
decode_cache: data/kidney_workspace/cache/materialized_splits

# Enforced, not preferred: the runner refuses to start on the processor unless
# --allow-cpu is passed, because a CPU torch build silently turns minutes into hours.
device: cuda

target_field: molecule
head: molecule_primary
threshold: 0.5
batch_size: 256
pixel_fraction: 1.0
sample_seed: 42
splits: [train, test]

campaigns:
  fisher: fischer-rao-spectral-hinge-experiment-20260906-01
  euclidean: contractive-20260905-01
  baseline: bce-baseline-20260905-01
  activation: fisher-rao-hinge-activation-20260907-01

analyses:
  prediction_sweep:
    # part_1_prediction_metric_weight_sweep.ipynb
    campaigns_used: [fisher, euclidean, baseline]
    output_directory: assets/experiments/autoencoder_architecture/notebooks/05_09_26_contractive_expaned/part_1_prediction_metric_weight_sweep_results

  latent_geometry_sweep:
    # part_2_latent_geometry_metric_weight_sweep.ipynb
    campaigns_used: [fisher, euclidean, baseline]
    splits: [test]
    pair_count: 5000
    knn_neighbors: 10
    epsilons: [0.001, 0.003, 0.01, 0.03, 0.1]
    output_directory: assets/experiments/autoencoder_architecture/notebooks/05_09_26_contractive_expaned/part_2_latent_geometry_metric_weight_sweep_results

  hinge_refinement:
    # part_4_hinge_activation_refinement.ipynb
    campaigns_used: [activation, fisher, baseline]
    planned_epochs: 15
    knn_neighbors: 10
    epsilons: [0.001, 0.003, 0.01, 0.03, 0.1]
    selected_cells:
      - "baseline (no contractive)"
      - "fisher_rao / frobenius / w=1e-05"
      - "fisher_rao / spectral / w=1e-05"
      - "fisher_rao / spectral_plus_hinged / w=1e-03 / tau=7"
      - "fisher_rao / spectral_plus_hinged / w=2e-03 / tau=7"
      - "fisher_rao / spectral_plus_hinged / w=4e-03 / tau=7"
      - "fisher_rao / spectral_plus_hinged / w=6e-03 / tau=7"
      - "fisher_rao / spectral_plus_hinged / w=8e-03 / tau=7"
      - "fisher_rao / spectral_plus_hinged / w=1e-02 / tau=7"
    output_directory: assets/experiments/autoencoder_architecture/notebooks/05_09_26_contractive_expaned/part_4_hinge_activation_refinement_results

  campaign_training_dynamics:
    # part_0_2_campaign_training_dynamics.ipynb
    campaigns_used: [fisher, euclidean, baseline]
    planned_epochs: 15
    output_directory: assets/experiments/autoencoder_architecture/notebooks/05_09_26_contractive_expaned/part_0_2_campaign_training_dynamics_results

  perturbation_anatomy:
    # part_0_3_perturbation_anatomy.ipynb
    campaigns_used: [activation, baseline]
    context_cell: "fisher_rao / spectral_plus_hinged / w=2e-03 / tau=7"
    splits: [test]
    anatomy_pixels: 2000
    shown_spectra: 3
    perturbation:
      shift_bins: 1
      extra_width_sigma: 1.0
      base_width_sigma: 0.42
      lognormal_sigma: 0.05
      noise_fraction: 0.02
    output_directory: assets/experiments/autoencoder_architecture/notebooks/05_09_26_contractive_expaned/part_0_3_perturbation_anatomy_results

  perturbation_response:
    # part_5_perturbation_response.ipynb
    campaigns_used: [activation, fisher, baseline]
    splits: [test]
    response_pixels: 2000
    noise_repeats: 4
    amplitudes: [0.0, 0.125, 0.25, 0.5, 0.75, 1.0]
    perturbation:
      shift_bins: 1
      extra_width_sigma: 1.0
      base_width_sigma: 0.42
      lognormal_sigma: 0.05
      noise_fraction: 0.02
    selected_cells:
      - "baseline (no contractive)"
      - "fisher_rao / frobenius / w=1e-05"
      - "fisher_rao / spectral / w=1e-05"
      - "fisher_rao / spectral_plus_hinged / w=1e-03 / tau=7"
      - "fisher_rao / spectral_plus_hinged / w=2e-03 / tau=7"
      - "fisher_rao / spectral_plus_hinged / w=4e-03 / tau=7"
      - "fisher_rao / spectral_plus_hinged / w=6e-03 / tau=7"
      - "fisher_rao / spectral_plus_hinged / w=8e-03 / tau=7"
      - "fisher_rao / spectral_plus_hinged / w=1e-02 / tau=7"
    output_directory: assets/experiments/autoencoder_architecture/notebooks/05_09_26_contractive_expaned/part_5_perturbation_response_results

  spectrum_reconstruction:
    # part_6_spectrum_reconstruction.ipynb
    campaigns_used: [activation, baseline]
    splits: [test]
    repetition: 0
    compared:
      baseline: "baseline (no contractive)"
      hinge 2e-3: "fisher_rao / spectral_plus_hinged / w=2e-03 / tau=7"
    sample_pixels: 2000
    cases_per_category: 2
    top_k: 10
    display_amplitudes: [0.0, 0.1, 0.5, 1.0]
    curve_amplitudes: [0.0, 0.05, 0.1, 0.25, 0.5, 0.75, 1.0]
    perturbation:
      shift_bins: 1
      extra_width_sigma: 1.0
      base_width_sigma: 0.42
      lognormal_sigma: 0.05
      noise_fraction: 0.02
    output_directory: assets/experiments/autoencoder_architecture/notebooks/05_09_26_contractive_expaned/part_6_spectrum_reconstruction_results
