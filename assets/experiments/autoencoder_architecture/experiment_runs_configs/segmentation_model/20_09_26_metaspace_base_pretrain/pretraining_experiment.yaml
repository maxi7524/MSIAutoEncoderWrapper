# Final paired synthetic-pretraining ablation for the selected predictive model.
# The three excluded source datasets remain outside every split in this campaign.
# Joint schedules shuffle single-bin and permutation rows in one optimizer phase;
# staged schedules train the same row populations in single-bin -> permutation order.
schema_version: 1

experiment:
  name: kidney-metaspace-pretraining-final

task:
  entrypoint: msi_autoencoder_wrapper.runtime.workflows.wrapper:run_wrapper_training
  preflight_entrypoint: msi_autoencoder_wrapper.runtime.workflows.wrapper:preflight_wrapper_training
  test_entrypoint: msi_autoencoder_wrapper.runtime.workflows.wrapper:test_wrapper_training
  plan_entrypoint: msi_autoencoder_wrapper.runtime.workflows.configured:resolve_single_image_campaign
  workflow: {strategy: pretraining_branches}
  parameters:
    factory: msi_autoencoder_wrapper.runtime.workflows.configured:build_single_image_autoencoder
    factory_parameters:
      project_path: data/kidney_workspace
      project_path_anchor: repository
      dtype: float32
      device: null
      image_path: datasets/kidney/kidney.imzML
      cohort_selection:
        strategy: merged_exclusion
        parameters:
          excluded_dataset_ids:
            - 2024-02-20_01h45m20s
            - 2024-02-20_01h46m58s
            - 2024-02-20_01h54m41s
      reader: {strategy: PyImzMLReader, parameters: {}}
      annotations: {strategy: auto, parameters: {}}
      binning: {grid: axes, select: binning}
      inverse_binning: {strategy: PassthroughInverseBinner}
      dataset:
        strategy: PixelDataset
        parameters:
          source: image
          normalization: tic
          target_specs:
            molecule: {type: multi_label}
          annotation_settings:
            mapping: {x_mapping: binner}
            selection:
              annotated_fraction: 1.0
              unannotated_fraction: 0.0
              max_unannotated_to_annotated_ratio: 0.0
              seed: 42
            targets:
              molecule:
                empty_spectrum_policy: exclude
                unobserved_label_policy: unlabelled
                add_annotation_presence_target: false
          subset:
            fraction: 0.2
            seed: 42
            method: proportional_multilabel
            parameters: {group_fields: dataset_id, minimum_positive_count: 3}
          split:
            strategy: proportional_multilabel
            fractions: {train: 0.9, validation: 0.05, test: 0.05}
            parameters: {group_fields: dataset_id, minimum_positive_per_split: 1}
      split_reference_binning:
        strategy: LinearBinning
        parameters:
          {bin_step: 0.55, x_min: 200.0, x_max: 900.0, aggregation: sum}
      variant: {grid: architectures}
      predictive:
        projector:
          strategy: LinearProjector
          parameters: {latent_dim: 10, projection_dim: 64}
        heads:
          # One logit head is reused by synthetic BCE and real-data VPU.
          molecule_vpu:
            target_field: molecule
            strategy: LinearClassificationHead
            parameters:
              latent_dim: 10
              output_dim: auto_from_target
              hidden_dim: 128
              dropout: 0.1
    model_name: null
    training:
      patience: 10
      continuation: {enabled: true, resume: true, checkpoint_every_epochs: 1}
      checkpoint: {enabled: true, restore_best: true}
      phases: {grid: schedules}

runs: {repetitions: 5}
seeds:
  common_seeds: {split: 42, dataloader: 43}
  run_seeds: {model_initialization: 1000, training: 2000}

grid:
  axes:
    values:
      - name: axis-200-900
        artifact_key: kidney-metaspace-200-900-v3
        min_fragments: 3
        max_fragments: 61
        binning:
          strategy: LinearBinning
          parameters:
            {bin_step: 0.55, x_min: 200.0, x_max: 900.0, aggregation: sum}
      - name: axis-100-3000
        artifact_key: kidney-metaspace-100-3000-v3
        min_fragments: 4
        max_fragments: 68
        binning:
          strategy: LinearBinning
          parameters:
            {bin_step: 0.55, x_min: 100.0, x_max: 3000.0, aggregation: sum}

  architectures:
    values:
      - name: conv1d-ae-32-16-8-latent-10
        preset: CNNAutoencoder
        parameters:
          latent_dim: 10
          channels: [1, 32, 16, 8]
          kernels: [5, 7, 3]
          strides: [3, 3, 3]
          output_normalization:
            type: tic
            parameters: {epsilon: 1.0e-12}

  schedules:
    values:
      # Real-only baseline; one independently trained model per axis.
      - - &real_only
          phase_name: real_only
          workflow_role: real_only
          epochs: 10
          batch_size: 64
          gradient_clip_norm: 5.0
          supervision_sampling: &real_supervision
            target_field: molecule
            proportions: {positive: 1, unlabelled: 1}
            replacement: true
            seed: 43
          optimizer: &optimizer
            type: AdamW
            params: {lr: 0.001, weight_decay: 0.0001}
          criterions: &real_objective
            reconstruction:
              masserstein: {target: MassersteinLoss, weight: 1.0}
            heads:
              molecule_vpu:
                vpu:
                  target: VariationalPULoss
                  weight: 0.2
                  params:
                    alpha: 1.0
                    beta: 1.0
                    consistency_weight: 0.0
                    negative_weight: 0.0
                    simulated_negative_weight: 0.0
            regularization:
              contractive:
                target: ContractiveLoss
                weight: 2.0e-3
                params:
                  calculation_method: exact_autograd_jacobian
                  latent_source: auto
                  penalty_metric: spectral_plus_hinged
                  penalized_space: u
                  input_geometry: fisher_rao
                  hinge_threshold: 7.0
                  hinge_alpha: 2.0
            contrastive:
              peak_permutation:
                target: InfoNCELoss
                weight: 0.001
                params:
                  peak_selection_method: permutation_label_invariant
                  temperature: 0.07
                  peak_sample_size: 10000
                  peak_catalog_limit: 4096
                  permutation_bank_size: 7000
                  permuted_peaks_per_view: 3
                  permutation_selection_attempts: 64
                  annotation_bin_radius: 0
                  preserve_input_normalization: true
                  negative_weighting_method: multilabel_jaccard
                  overlapping_label_negative_weight: 0.1
          evaluate_test: true

      # P0: single bins only.
      - - &synthetic_axis_pretraining
          phase_name: synthetic_single
          workflow_role: pretrained
          epochs: 10
          batch_size: 64
          gradient_clip_norm: 5.0
          optimizer: *optimizer
          pretraining:
            kind: precomputed_synthetic
            population: axis
            validation_samples: 2048
            artifact: &synthetic_artifact
              key: {grid: axes, select: artifact_key}
              cache_directory: data/kidney_workspace/precompute/synthetic_pretraining
              peak_source: annotation
              seed: 42
              normalization: tic
              representation:
                strategy: isospec_envelope
                parameters:
                  probability_coverage: 0.999
                  max_isotopologues: 4096
                  occupancy_alpha: 1.0
                  intensity_log_sigma: 0.5
              blank_peak_radius: 0
              component_mixing:
                distribution: dirichlet
                minimum_annotated_concentration: 2.0
                blank_concentration: 1.0
              populations:
                axis:
                  strategy: axis_coverage
                  repetitions_per_bin: 10
                permutation_base:
                  strategy: class_quota_mixture
                  class_quota: 30
                  blank_bin_quota: 30
                  min_fragments: {grid: axes, select: min_fragments}
                  max_fragments: {grid: axes, select: max_fragments}
                permutation_overlap:
                  strategy: class_quota_mixture
                  class_quota: 30
                  blank_bin_quota: 30
                  overlap_bonus_per_class: 30
                  min_fragments: {grid: axes, select: min_fragments}
                  max_fragments: {grid: axes, select: max_fragments}
                permutation_rare:
                  strategy: class_quota_mixture
                  class_quota: 30
                  blank_bin_quota: 30
                  rare_bonus_per_class: 30
                  rare_fraction: 0.25
                  min_fragments: {grid: axes, select: min_fragments}
                  max_fragments: {grid: axes, select: max_fragments}
                permutation_all:
                  strategy: class_quota_mixture
                  class_quota: 30
                  blank_bin_quota: 30
                  overlap_bonus_per_class: 30
                  rare_bonus_per_class: 30
                  rare_fraction: 0.25
                  min_fragments: {grid: axes, select: min_fragments}
                  max_fragments: {grid: axes, select: max_fragments}
                joint_base:
                  strategy: combined
                  members: [axis, permutation_base]
                joint_overlap:
                  strategy: combined
                  members: [axis, permutation_overlap]
                joint_rare:
                  strategy: combined
                  members: [axis, permutation_rare]
                joint_all:
                  strategy: combined
                  members: [axis, permutation_all]
          criterions: &synthetic_objective
            reconstruction:
              masserstein: {target: MassersteinLoss, weight: 1.0}
            heads:
              molecule_vpu:
                bce: {target: MultiLabelBCELoss, weight: 0.2}
        - &pretrain_only_test
          phase_name: pretrain_only_real_test
          workflow_role: pretrained
          epochs: 0
          batch_size: 64
          criterions: *real_objective
          evaluate_test: true
          evaluation_data: real
        - &real_frozen
          phase_name: real_adaptation_frozen_head
          workflow_role: frozen_head
          epochs: 10
          batch_size: 64
          gradient_clip_norm: 5.0
          supervision_sampling: *real_supervision
          optimizer: *optimizer
          freeze: [heads.molecule_vpu]
          criterions: *real_objective
          evaluate_test: true
        - &real_unfrozen
          <<: *real_frozen
          phase_name: real_adaptation_unfrozen_head
          workflow_role: unfrozen_head
          freeze: []

      # P1: permutations only.
      - - &synthetic_permutation_base_pretraining
          phase_name: synthetic_permutation_base
          workflow_role: pretrained
          epochs: 10
          batch_size: 64
          gradient_clip_norm: 5.0
          optimizer: *optimizer
          pretraining:
            kind: precomputed_synthetic
            population: permutation_base
            validation_samples: 2048
            artifact: *synthetic_artifact
          criterions: *synthetic_objective
        - *pretrain_only_test
        - *real_frozen
        - *real_unfrozen

      # P2 joint: single + base permutations in one shuffled phase.
      - - &synthetic_joint_base_pretraining
          <<: *synthetic_permutation_base_pretraining
          phase_name: synthetic_joint_base
          pretraining:
            kind: precomputed_synthetic
            population: joint_base
            validation_samples: 2048
            artifact: *synthetic_artifact
        - *pretrain_only_test
        - *real_frozen
        - *real_unfrozen

      # P2 staged: single, then base permutations.
      - - &synthetic_axis_stage
          <<: *synthetic_axis_pretraining
          phase_name: synthetic_single_stage
        - *synthetic_permutation_base_pretraining
        - *pretrain_only_test
        - *real_frozen
        - *real_unfrozen

      # P3 joint: single + permutations carrying additive overlap quota.
      - - &synthetic_joint_overlap_pretraining
          <<: *synthetic_permutation_base_pretraining
          phase_name: synthetic_joint_overlap
          pretraining:
            kind: precomputed_synthetic
            population: joint_overlap
            validation_samples: 2048
            artifact: *synthetic_artifact
        - *pretrain_only_test
        - *real_frozen
        - *real_unfrozen

      # P3 staged.
      - - *synthetic_axis_stage
        - &synthetic_permutation_overlap_pretraining
          <<: *synthetic_permutation_base_pretraining
          phase_name: synthetic_permutation_overlap
          pretraining:
            kind: precomputed_synthetic
            population: permutation_overlap
            validation_samples: 2048
            artifact: *synthetic_artifact
        - *pretrain_only_test
        - *real_frozen
        - *real_unfrozen

      # P4 joint: single + permutations carrying additive rare-class quota.
      - - &synthetic_joint_rare_pretraining
          <<: *synthetic_permutation_base_pretraining
          phase_name: synthetic_joint_rare
          pretraining:
            kind: precomputed_synthetic
            population: joint_rare
            validation_samples: 2048
            artifact: *synthetic_artifact
        - *pretrain_only_test
        - *real_frozen
        - *real_unfrozen

      # P4 staged.
      - - *synthetic_axis_stage
        - &synthetic_permutation_rare_pretraining
          <<: *synthetic_permutation_base_pretraining
          phase_name: synthetic_permutation_rare
          pretraining:
            kind: precomputed_synthetic
            population: permutation_rare
            validation_samples: 2048
            artifact: *synthetic_artifact
        - *pretrain_only_test
        - *real_frozen
        - *real_unfrozen

      # P5 joint: all quotas in one shuffled phase.
      - - &synthetic_joint_all_pretraining
          <<: *synthetic_permutation_base_pretraining
          phase_name: synthetic_joint_all
          pretraining:
            kind: precomputed_synthetic
            population: joint_all
            validation_samples: 2048
            artifact: *synthetic_artifact
        - *pretrain_only_test
        - *real_frozen
        - *real_unfrozen

      # P5 staged: single, then one shared base+overlap+rare permutation phase.
      - - *synthetic_axis_stage
        - &synthetic_permutation_all_pretraining
          <<: *synthetic_permutation_base_pretraining
          phase_name: synthetic_permutation_all
          pretraining:
            kind: precomputed_synthetic
            population: permutation_all
            validation_samples: 2048
            artifact: *synthetic_artifact
        - *pretrain_only_test
        - *real_frozen
        - *real_unfrozen

execution:
  backend: local
  max_parallel_runs: 1
  entropy:
    task_walltime: 06:00:00

reports: []
reporting: {continue_on_error: true}
