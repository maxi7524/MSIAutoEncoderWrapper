[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "msi-dataset-manager"
version = "0.1.0"
description = "Provider-independent discovery, materialization, cataloguing, and composition of MSI datasets"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pyimzml",
    "tqdm",
]

[project.optional-dependencies]
metaspace = ["metaspace2020==2.0.9", "requests"]
pride = ["pridepy==0.0.16"]
providers = ["metaspace2020==2.0.9", "requests", "pridepy==0.0.16"]

[project.scripts]
msi-datasets = "msi_dataset_manager.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
