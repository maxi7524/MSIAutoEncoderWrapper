execution:
  backend: slurm
  staging:
    enabled: true
    root: /shared/node-ram/msi-wrapper
    verification: checksum
    cleanup_on_success: true
    cleanup_on_failure: true
    inputs: []
    # Results are copied and checksum-verified before the RAM directory is removed.
    results: []
  slurm:
    partition: gpu
    time: "12:00:00"
    cpus_per_task: 8
    memory: 32G
    gpus_per_task: 1
    array_parallelism: 1
