# Cohort experiment: held-out images are selected by the adjacent metadata analysis.
# The selected images are excluded before construction of the 90/5/5 spatial split.
# TODO: Replace the provisional CNN preset with each selected final architecture.
schema_version: 1

experiment:
  name: kidney-cohort-pretrain-bce-vpu

task:
  entrypoint: msi_autoencoder_wrapper.runtime.workflows.wrapper:run_wrapper_training
  preflight_entrypoint: msi_autoencoder_wrapper.runtime.workflows.wrapper:preflight_wrapper_training
  test_entrypoint: msi_autoencoder_wrapper.runtime.workflows.wrapper:test_wrapper_training
  plan_entrypoint: msi_autoencoder_wrapper.runtime.workflows.configured:resolve_cohort_campaign
  parameters:
    factory: msi_autoencoder_wrapper.runtime.workflows.configured:build_cohort_autoencoder
    factory_parameters:
      project_path: data/kidney_workspace
      project_path_anchor: repository
      dtype: float32
      device: null
      cohort_name: kidney_pretrain_training
      # The table contains the three external images and is the canonical exclusion gate.
      cohort_selection_path: ../../assets/experiments/autoencoder_architecture/notebooks/segmentation_model/20_09_metaspace_pretrain/part_0_1_cohort_selection_results/cohort_image_summary.csv
      reader: {strategy: PyImzMLReader, parameters: {}}
      annotations: {strategy: auto, parameters: {}}
      # Paired input axes: unmeasured regions remain zero after binning.
      binning: {grid: axes}
      dataset:
        strategy: CohortPixelDataset
        parameters:
          source: image
          normalization: tic
          # This generated, training-only catalogue freezes target-column order for every member.
          annotation_catalogue_path: ../../assets/experiments/autoencoder_architecture/notebooks/segmentation_model/20_09_metaspace_pretrain/part_0_1_cohort_selection_results/training_label_coverage.csv
          target_specs:
            molecule: {type: multi_label}
          annotation_settings:
            mapping: {x_mapping: binner}
            selection:
              annotated_fraction: 1.0
              unannotated_fraction: 0.0
              max_unannotated_to_annotated_ratio: 0.0
              seed: 42
            targets:
              molecule:
                empty_spectrum_policy: exclude
                unobserved_label_policy: assume_negative
                add_annotation_presence_target: false
          # Keep a reproducible 20% of the real cohort, stratified by image.
          subset:
            fraction: 0.2
            seed: 42
            method: stratified_random
            parameters: {group_fields: image_key}
          split:
            strategy: spatial_block
            fractions: {train: 0.9, validation: 0.05, test: 0.05}
            parameters: {block_size: 16}
      variant: {grid: architectures}
      predictive:
        projector:
          strategy: LinearProjector
          parameters: {latent_dim: 10, projection_dim: 64}
        heads:
          molecule_primary:
            target_field: molecule
            strategy: LinearClassificationHead
            parameters: {latent_dim: 10, output_dim: auto_from_target, hidden_dim: 128, dropout: 0.1}
    model_name: null
    training:
      patience: 10
      continuation: {enabled: true, resume: true, checkpoint_every_epochs: 1}
      checkpoint: {enabled: true, restore_best: true}
      phases: {grid: schedules}

runs: {repetitions: 5}
seeds:
  common_seeds: {split: 42, dataloader: 43}
  run_seeds: {model_initialization: 1000, training: 2000}

grid:
  axes:
    values:
      - strategy: LinearBinning
        parameters: {bin_step: 0.55, x_min: 200.0, x_max: 900.0, aggregation: sum}
      - strategy: LinearBinning
        parameters: {bin_step: 0.55, x_min: 100.0, x_max: 3000.0, aggregation: sum}
  architectures:
    values:
      - name: TODO-selected-model
        preset: CNNAutoencoder
        parameters:
          latent_dim: 10
          channels: [1, 32, 16, 8]
          kernels: [5, 7, 3]
          strides: [3, 3, 3]
          output_normalization: {type: tic, parameters: {epsilon: 1.0e-12}}
  schedules:
    values:
      # S0: every binner coordinate appears exactly 15 times; no mixture pool.
      - &s0
        - &synthetic_s0
          phase_name: synthetic_bce_s0_axis_only
          epochs: 15
          batch_size: 64
          gradient_clip_norm: 5.0
          optimizer: &optimizer {type: AdamW, params: {lr: 0.001, weight_decay: 0.0001}}
          pretraining:
            samples: 19095
            validation_samples: 2048
            seed: 42
            normalization: tic
            sampling_plan:
              - strategy: annotation_axis_coverage
                count: 19095
          criterions: &synthetic_bce
            heads:
              molecule_primary:
                bce: {target: MultiLabelBCELoss, weight: 1.0}
          save_model_state_as: synthetic_bce
          evaluate_test: true
          evaluation_data: real
        - &pretrain_only
          phase_name: pretrain_only_real_test
          epochs: 0
          restore_model_state_from: synthetic_bce
          criterions: *synthetic_bce
          evaluate_test: true
          evaluation_data: real
        - &real_frozen
          phase_name: real_vpu_frozen_head
          epochs: 15
          batch_size: 64
          gradient_clip_norm: 5.0
          optimizer: *optimizer
          restore_model_state_from: synthetic_bce
          freeze: [heads.molecule_primary]
          criterions: &real_vpu
            reconstruction:
              masserstein: {target: MassersteinLoss, weight: 1.0}
            heads:
              molecule_primary:
                vpu: {target: VariationalPULoss, weight: 0.2, params: {alpha: 1.0, beta: 1.0, consistency_weight: 0.0, negative_weight: 0.0, simulated_negative_weight: 0.0}}
            regularization:
              contractive:
                target: ContractiveLoss
                weight: 2.0e-3
                params: {calculation_method: exact_autograd_jacobian, latent_source: auto, penalty_metric: spectral_plus_hinged, penalized_space: u, input_geometry: fisher_rao, hinge_threshold: 7.0, hinge_alpha: 2.0}
            contrastive:
              peak_permutation:
                target: InfoNCELoss
                weight: 0.001
                params: {peak_selection_method: permutation_label_invariant, temperature: 0.07, peak_sample_size: 10000, peak_catalog_limit: 4096, permutation_bank_size: 7000, permuted_peaks_per_view: 3, permutation_selection_attempts: 64, annotation_bin_radius: 0, preserve_input_normalization: true}
          evaluate_test: true
        -
          phase_name: real_vpu_unfrozen_head
          epochs: 15
          batch_size: 64
          gradient_clip_norm: 5.0
          optimizer: *optimizer
          restore_model_state_from: synthetic_bce
          criterions: *real_vpu
          evaluate_test: true

      # S1: S0 plus a marginally class-balanced mixture pool; total is held at 65,535.
      - &s1
        - <<: *synthetic_s0
          phase_name: synthetic_bce_s1_uniform_mixtures
          pretraining:
            samples: 65535
            validation_samples: 4096
            seed: 42
            normalization: tic
            sampling_plan:
              - {strategy: annotation_axis_coverage, count: 19095}
              - strategy: annotation_uniform_mixture
                count: 46440
                parameters: {min_peaks: 15, max_peaks: 30}
        - <<: *pretrain_only
        - <<: *real_frozen
        - <<: *real_frozen
          phase_name: real_vpu_unfrozen_head
          freeze: []

      # S2: S1 plus a separate overlap pool; its 8,000 examples replace uniform draws.
      - &s2
        - <<: *synthetic_s0
          phase_name: synthetic_bce_s2_uniform_plus_overlap
          pretraining:
            samples: 65535
            validation_samples: 4096
            seed: 42
            normalization: tic
            sampling_plan:
              - {strategy: annotation_axis_coverage, count: 19095}
              - {strategy: annotation_uniform_mixture, count: 38440, parameters: {min_peaks: 15, max_peaks: 30}}
              - {strategy: annotation_overlap_mixture, count: 8000, parameters: {min_peaks: 15, max_peaks: 30}}
        - <<: *pretrain_only
        - <<: *real_frozen
        - <<: *real_frozen
          phase_name: real_vpu_unfrozen_head
          freeze: []

      # S3: S1 plus a separate rare-class pool; again total count stays fixed.
      - &s3
        - <<: *synthetic_s0
          phase_name: synthetic_bce_s3_uniform_plus_rare
          pretraining:
            samples: 65535
            validation_samples: 4096
            seed: 42
            normalization: tic
            sampling_plan:
              - {strategy: annotation_axis_coverage, count: 19095}
              - {strategy: annotation_uniform_mixture, count: 38440, parameters: {min_peaks: 15, max_peaks: 30}}
              - {strategy: annotation_rare_class_mixture, count: 8000, parameters: {min_peaks: 15, max_peaks: 30, rare_fraction: 0.25}}
        - <<: *pretrain_only
        - <<: *real_frozen
        - <<: *real_frozen
          phase_name: real_vpu_unfrozen_head
          freeze: []

      # S4: S1 plus overlap and rare pools as two independent additions.
      -
        - <<: *synthetic_s0
          phase_name: synthetic_bce_s4_uniform_plus_overlap_plus_rare
          pretraining:
            samples: 65535
            validation_samples: 4096
            seed: 42
            normalization: tic
            sampling_plan:
              - {strategy: annotation_axis_coverage, count: 19095}
              - {strategy: annotation_uniform_mixture, count: 30440, parameters: {min_peaks: 15, max_peaks: 30}}
              - {strategy: annotation_overlap_mixture, count: 8000, parameters: {min_peaks: 15, max_peaks: 30}}
              - {strategy: annotation_rare_class_mixture, count: 8000, parameters: {min_peaks: 15, max_peaks: 30, rare_fraction: 0.25}}
        - <<: *pretrain_only
        - <<: *real_frozen
        - <<: *real_frozen
          phase_name: real_vpu_unfrozen_head
          freeze: []

execution: {backend: local, max_parallel_runs: 1}
reports: []
reporting: {continue_on_error: true}
