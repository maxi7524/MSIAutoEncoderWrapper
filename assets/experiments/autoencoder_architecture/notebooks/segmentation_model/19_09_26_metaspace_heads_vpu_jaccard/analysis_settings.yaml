# Paths are relative to the repository root; absolute paths are also accepted.
#
# Analysis settings for the Jaccard-weighted contrastive negative-weighting
# comparison. Four VPU objectives, previously selected from the expanded
# contrastive sweep, are each re-run with three multilabel-Jaccard negative
# weights (0.1 / 0.25 / 0.5); the matching no-Jaccard baseline for every
# objective is loaded from the expanded sweep for direct comparison.
workspace: data/kidney_workspace
model_store: data/kidney_workspace/models/kidney
experiment_config: assets/experiments/autoencoder_architecture/experiment_runs_configs/segmentation_model/14_09_26_predictive_final/vpu_contractive_interaction.yaml
cache_directory: data/kidney_workspace/cache/metaspace_heads_vpu_jaccard
annotation_evidence_cache: data/kidney_workspace/cache/evidence/metaspace_heads_vpu_contractive_full.npz

precompute:
  strategy: autoencoder.heads_general_analysis
  output_directory: assets/experiments/autoencoder_architecture/notebooks/segmentation_model/19_09_26_metaspace_heads_vpu_jaccard/precompute

sources:
  - name: vpu_contractive_interaction_expanded
    experiment_name: kidney-vpu-contractive-interaction-expanded
    experiment_config: assets/experiments/autoencoder_architecture/experiment_runs_configs/segmentation_model/14_09_26_predictive_final/vpu_contractive_interaction_expanded.yaml
    status_directory: data/kidney_workspace/configs/entropy-runs/vpu-contractive-interaction-expanded-20260917-01/plan/status
    required: true
    role: baseline
    enabled: true
  - name: vpu_jaccard_shortlist
    experiment_name: kidney-vpu-jaccard-shortlist
    experiment_config: assets/experiments/autoencoder_architecture/experiment_runs_configs/segmentation_model/14_09_26_predictive_final/vpu_jaccard_shortlist.yaml
    status_directory: data/kidney_workspace/configs/entropy-runs/vpu-jaccard-20260919-01/plan/status
    required: true
    role: candidate
    enabled: true

# Stable analysis aliases are resolved against the joint inventory of every source.
# ``grid_id`` is the deterministic campaign cell identity; the campaign is only the
# locator needed to distinguish two independent runs with the same grid numbering.
# Tags are arbitrary analytical metadata, not conditions interpreted by precompute.
models:
  # Objective 1: VPU + contrastive, T=0.30, w=0.01.
  vpu_contrastive_t030_w10m:
    display_label: "VPU + contrastive (T=0.30, w=0.01)"
    select: {source: vpu_contractive_interaction_expanded, grid_id: grid_0018}
    tags: {family: vpu, contrastive: true, contractive: false, temperature: 0.30, weight: 0.01}
    visualization: {order: 0, color: "#D55E00", line_style: solid, marker: "s"}
  vpu_contrastive_t030_w10m_j10:
    display_label: "VPU + contrastive (T=0.30, w=0.01, j=0.1)"
    select: {source: vpu_jaccard_shortlist, grid_id: grid_0000}
    tags: {family: vpu, contrastive: true, contractive: false, temperature: 0.30, weight: 0.01, jaccard_weight: 0.1}
    visualization: {order: 1, color: "#D55E00", line_style: solid, marker: "o"}
  vpu_contrastive_t030_w10m_j25:
    display_label: "VPU + contrastive (T=0.30, w=0.01, j=0.25)"
    select: {source: vpu_jaccard_shortlist, grid_id: grid_0001}
    tags: {family: vpu, contrastive: true, contractive: false, temperature: 0.30, weight: 0.01, jaccard_weight: 0.25}
    visualization: {order: 2, color: "#D55E00", line_style: solid, marker: "s"}
  vpu_contrastive_t030_w10m_j50:
    display_label: "VPU + contrastive (T=0.30, w=0.01, j=0.5)"
    select: {source: vpu_jaccard_shortlist, grid_id: grid_0002}
    tags: {family: vpu, contrastive: true, contractive: false, temperature: 0.30, weight: 0.01, jaccard_weight: 0.5}
    visualization: {order: 3, color: "#D55E00", line_style: solid, marker: "^"}

  # Objective 2: VPU + contrastive, T=0.07, w=0.01.
  vpu_contrastive_t007_w10m:
    display_label: "VPU + contrastive (T=0.07, w=0.01)"
