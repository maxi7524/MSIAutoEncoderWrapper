# Paired dataset selection, split, and five repetition seeds match the 05_09_26 BCE baseline.
# Deferred auxiliary-head template: run only after selecting the main presence loss.
# Chemical classes use masked BCE on certain positives, never VPU or constructed negatives.
# The auxiliary head has the same fixed loss weight 0.2 as the main head.
# The chemical-class ablation keeps all non-chemical heads identical within each contrastive pair.
# Chemical targets represent presence of certain classes, not summed molecular or atom counts.
# ClassyFire/ChemOnt exports are also supported through a normalized versioned JSON snapshot.
# TODO: Replace the provisional balanced BCE ion objective with the selected head objective.

schema_version: 1
experiment:
  name: kidney-predictive-chemical-class
task:
  entrypoint: msi_autoencoder_wrapper.runtime.workflows.wrapper:run_wrapper_training
  preflight_entrypoint: msi_autoencoder_wrapper.runtime.workflows.wrapper:preflight_wrapper_training
  test_entrypoint: msi_autoencoder_wrapper.runtime.workflows.wrapper:test_wrapper_training
  plan_entrypoint: msi_autoencoder_wrapper.runtime.workflows.configured:resolve_single_image_campaign
  parameters:
    factory: msi_autoencoder_wrapper.runtime.workflows.configured:build_single_image_autoencoder
    factory_parameters:
      project_path: data/kidney_workspace
      project_path_anchor: repository
      image_path: datasets/kidney/kidney.imzML
      device: null
      reader:
        strategy: PyImzMLReader
        parameters: {}
      annotations:
        strategy: auto
        parameters: {}
      binning:
        strategy: LinearBinning
        parameters:
          bin_step: 0.55
          x_min: 200.0
          x_max: 900.0
          aggregation: sum
      inverse_binning:
        strategy: PassthroughInverseBinner
      dataset:
        strategy: PixelDataset
        parameters:
          source: image
          normalization: tic
          target_specs:
            molecule:
              type: multi_label
            chemical_class:
              type: multi_label
          annotation_settings:
            mapping:
              x_mapping: binner
            selection:
              annotated_fraction: 1.0
              unannotated_fraction: 0.0
              max_unannotated_to_annotated_ratio: 0.0
              seed: 42
            targets:
              molecule:
                empty_spectrum_policy: exclude
                unobserved_label_policy: unlabelled
                add_annotation_presence_target: false
          subset:
            fraction: 0.1
            seed: 42
            method: proportional_multilabel
            parameters:
              group_fields: dataset_id
              minimum_positive_count: 3
          split:
            strategy: proportional_multilabel
            fractions:
              train: 0.8
              validation: 0.1
              test: 0.1
            parameters:
              group_fields: dataset_id
              minimum_positive_per_split: 1
          # TODO: Create the enrichment snapshot and set its actual path, provider, and version.
          # Run: python -m msi_dataset_manager.annotations.chemistry --annotations <source.sqlite>
          #   --output <workspace>/annotations/chemistry.sqlite --lipidmaps-version 2026-09-07
          chemistry:
            path: annotations/chemistry.sqlite
            provider: LIPID_MAPS
            version: '2026-09-07'
      variant:
        grid: architectures
      predictive:
        projector:
          strategy: LinearProjector
          parameters:
            latent_dim: 10
            projection_dim: 64
        heads:
          molecule_primary:
            target_field: molecule
            strategy: LinearClassificationHead
            parameters:
              latent_dim: 10
              output_dim: auto_from_target
              hidden_dim: 128
              dropout: 0.1
          chemical_class:
            target_field: chemical_class
            strategy: LinearClassificationHead
            parameters:
              latent_dim: 10
              output_dim: auto_from_target
              hidden_dim: 128
              dropout: 0.1
    model_name: null
    training:
      patience: 10
      continuation:
        enabled: true
        resume: true
        checkpoint_every_epochs: 1
      checkpoint:
        enabled: true
        restore_best: true
      phases:
      - phase_name: joint_predictive
        epochs: 15
        batch_size: 64
        gradient_clip_norm: 5.0
        optimizer:
          type: AdamW
          params:
            lr: 0.001
            weight_decay: 0.0001
        criterions:
          grid: objectives
runs:
  repetitions: 5
seeds:
  common_seeds:
    split: 42
    dataloader: 43
  run_seeds:
    model_initialization: 1000
    training: 2000
grid:
  # TODO: Replace this baseline architecture after model selection; align all latent_dim values.
  architectures:
    values:
    - name: conv1d-ae-32-16-8-latent-10
      preset: CNNAutoencoder
      parameters:
        latent_dim: 10
        channels:
        - 1
        - 32
        - 16
        - 8
        kernels:
        - 5
        - 7
        - 3
        strides:
        - 3
        - 3
        - 3
        output_normalization:
          type: tic
          parameters:
            epsilon: 1.0e-12
  objectives:
    values:
    - reconstruction:
        masserstein:
          target: MassersteinLoss
          weight: 1.0
      heads: &ion_bce_heads
        molecule_primary:
          balanced_bce:
            target: ClassBalancedMultiLabelBCELoss
            weight: 0.2
            params:
              class_balance_method: train_inverse_prevalence
              max_positive_weight: 20.0
              reduction: balanced_class_mean
              unknown_label_policy: assume_negative
    - reconstruction:
        masserstein:
          target: MassersteinLoss
          weight: 1.0
      heads: *ion_bce_heads
      contrastive: &label_invariant_contrastive
        peak_permutation:
          target: InfoNCELoss
          weight: 0.1
          params:
            peak_selection_method: permutation_label_invariant
            temperature: 0.07
            peak_sample_size: 1000
            peak_catalog_limit: 4096
            permutation_bank_size: 7000
            permuted_peaks_per_view: 3
            permutation_selection_attempts: 64
            annotation_bin_radius: 0
            preserve_input_normalization: true
    - reconstruction:
        masserstein:
          target: MassersteinLoss
          weight: 1.0
      heads: &chemical_class_heads
        molecule_primary:
          balanced_bce:
            target: ClassBalancedMultiLabelBCELoss
            weight: 0.2
            params:
              class_balance_method: train_inverse_prevalence
              max_positive_weight: 20.0
              reduction: balanced_class_mean
              unknown_label_policy: assume_negative
        chemical_class:
          masked_bce:
            target: MultiLabelBCELoss
            weight: 0.2
    - reconstruction:
        masserstein:
          target: MassersteinLoss
          weight: 1.0
      heads: *chemical_class_heads
      contrastive: *label_invariant_contrastive
execution:
  backend: local
  max_parallel_runs: 1
  entropy:
    task_walltime: 01:00:00
reports: []
reporting:
  continue_on_error: true
