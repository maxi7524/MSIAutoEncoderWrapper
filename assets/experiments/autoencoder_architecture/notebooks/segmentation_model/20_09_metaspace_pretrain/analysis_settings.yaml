                      result_directory: part_3_02_reconstruction_results}
  stage_prediction:
    # Root of the notebook collection; result paths are set per stage.
    output_directory: assets/experiments/autoencoder_architecture/notebooks/segmentation_model/20_09_metaspace_pretrain
    stages:
