    visualization: {order: 5, color: "#0072B2", line_style: solid, marker: "o"}
  vpu_contrastive_t007_w10m_j25:
    display_label: "VPU + contrastive (T=0.07, w=0.01, j=0.25)"
    select: {source: vpu_jaccard_shortlist, grid_id: grid_0004}
