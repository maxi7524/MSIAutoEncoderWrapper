schema_version: 1

experiment:
  name: kidney-nnpu-objective-controls

task:
  entrypoint: msi_autoencoder_wrapper.runtime.workflows.wrapper:run_wrapper_training
  preflight_entrypoint: msi_autoencoder_wrapper.runtime.workflows.wrapper:preflight_wrapper_training
  test_entrypoint: msi_autoencoder_wrapper.runtime.workflows.wrapper:test_wrapper_training
  plan_entrypoint: msi_autoencoder_wrapper.runtime.workflows.configured:resolve_single_image_campaign
  parameters:
    factory: msi_autoencoder_wrapper.runtime.workflows.configured:build_single_image_autoencoder
    factory_parameters:
      project_path: data/kidney_workspace
      project_path_anchor: repository
      image_path: datasets/kidney/kidney.imzML
      device: null
      reader:
        strategy: PyImzMLReader
        parameters: {}
      annotations:
        strategy: auto
        parameters: {}
      binning:
        strategy: LinearBinning
        parameters:
          bin_step: 0.55
          x_min: 200.0
          x_max: 900.0
          aggregation: sum
      inverse_binning:
        strategy: PassthroughInverseBinner
      dataset:
        strategy: PixelDataset
        parameters:
          source: image
          normalization: tic
          target_specs:
            molecule:
              type: multi_label
          annotation_settings:
            mapping:
              x_mapping: binner
            selection:
              annotated_fraction: 1.0
              unannotated_fraction: 0.0
              max_unannotated_to_annotated_ratio: 0.0
              seed: 42
            targets:
              molecule:
                empty_spectrum_policy: exclude
                unobserved_label_policy: unlabelled
                add_annotation_presence_target: false
          subset:
            fraction: 0.1
            seed: 42
            method: stratified_random
            parameters:
              group_fields: dataset_id
          split:
            strategy: grouped
            fractions: {train: 0.8, validation: 0.1, test: 0.1}
            parameters:
              group_fields: dataset_id
      variant:
        grid: architectures
      predictive:
        projector:
          strategy: LinearProjector
          parameters: {latent_dim: 10, projection_dim: 64}
        heads:
          molecule_primary:
            target_field: molecule
            strategy: LinearClassificationHead
            parameters: {latent_dim: 10, output_dim: auto_from_target, hidden_dim: 128, dropout: 0.1}
    model_name: null
    training:
      patience: 10
      continuation: {enabled: true, resume: true, checkpoint_every_epochs: 1}
      checkpoint: {enabled: true, restore_best: true}
      phases:
        - phase_name: joint_predictive
          epochs: 15
          batch_size: 64
          gradient_clip_norm: 5.0
          optimizer:
            type: AdamW
            params: {lr: 0.001, weight_decay: 0.0001}
          criterions:
            grid: objectives

runs: {repetitions: 5}
seeds:
  common_seeds: {split: 42, dataloader: 43}
  run_seeds: {model_initialization: 1000, training: 2000}

grid:
  architectures:
    values:
      - name: conv1d-ae-32-16-8-latent-10
        preset: CNNAutoencoder
        parameters:
          latent_dim: 10
          channels: [1, 32, 16, 8]
          kernels: [5, 7, 3]
          strides: [3, 3, 3]
          output_normalization: {type: tic, parameters: {epsilon: 1.0e-12}}
  objectives:
    values:
      # grid_0007: contractive + label-invariant contrastive + unweighted BCE.
      - reconstruction: &reconstruction
          masserstein: {target: MassersteinLoss, weight: 1.0}
        regularization: &contractive
          contractive:
            target: ContractiveLoss
            weight: 0.001
            params: {calculation_method: approximate_hutchinson_vjp, num_probes: 5, probe_distribution: rademacher, latent_source: auto}
        contrastive: &label_invariant
          peak_permutation:
            target: InfoNCELoss
            weight: 0.1
            params: {peak_selection_method: permutation_label_invariant, temperature: 0.07, peak_sample_size: 1000, peak_catalog_limit: 4096, permutation_bank_size: 7000, permuted_peaks_per_view: 3, permutation_selection_attempts: 64, annotation_bin_radius: 0, preserve_input_normalization: true}
        heads: &plain_bce
          molecule_primary:
            bce: {target: MultiLabelBCELoss, weight: 0.2, params: {reduction: mean}}
      # grid_0008: contractive + label-invariant contrastive + Jaccard + nnPU.
      - reconstruction: *reconstruction
        regularization: *contractive
        contrastive:
          peak_permutation:
            target: InfoNCELoss
            weight: 0.1
            params: {peak_selection_method: permutation_label_invariant, temperature: 0.07, peak_sample_size: 1000, peak_catalog_limit: 4096, permutation_bank_size: 7000, permuted_peaks_per_view: 3, permutation_selection_attempts: 64, annotation_bin_radius: 0, preserve_input_normalization: true, negative_weighting_method: multilabel_jaccard, overlapping_label_negative_weight: 0.25}
        heads: &nnpu
          molecule_primary:
            nnpu: {target: NNPUMultiLabelLoss, weight: 0.2, params: {prior_method: scaled_train_observed, prior_multiplier: 1.5, min_prior: 0.0001, max_prior: 0.99}}
      # grid_0011: reconstruction + unweighted BCE only.
      - reconstruction: *reconstruction
        heads: *plain_bce
      # grid_0012: reconstruction + nnPU only.
      - reconstruction: *reconstruction
        heads: *nnpu

execution: {backend: local, max_parallel_runs: 1}
reports: []
reporting: {continue_on_error: true}
