# Paths are relative to the repository root; absolute paths are also accepted.
#
# Analysis settings for the four-condition VPU/contractive comparison.
workspace: data/kidney_workspace
model_store: data/kidney_workspace/models/kidney
experiment_config: assets/experiments/autoencoder_architecture/experiment_runs_configs/segmentation_model/14_09_26_predictive_final/vpu_contractive_interaction.yaml
cache_directory: data/kidney_workspace/cache/metaspace_heads_vpu_contractive
annotation_evidence_cache: data/kidney_workspace/cache/evidence/metaspace_heads_vpu_contractive_full.npz

precompute:
  strategy: autoencoder.heads_general_analysis
  output_directory: assets/experiments/autoencoder_architecture/notebooks/segmentation_model/17_09_26_metaspace_heads_vpu_contractive/precompute

sources:
  - name: vpu_precision_sweep
    experiment_name: kidney-vpu-precision-sweep
    experiment_config: assets/experiments/autoencoder_architecture/experiment_runs_configs/segmentation_model/14_09_26_predictive_final/vpu_precision_sweep.yaml
    status_directory: data/kidney_workspace/configs/entropy-runs/predictie-final-vpu-modifications-20260914-01/plan/status
    required: true
    role: baseline
    enabled: true
    include_labels:
      - "vpu_alpha_1_beta_1 (VariationalPULoss)"
  - name: vpu_contractive_interaction
    experiment_name: kidney-vpu-contractive-interaction
    experiment_config: assets/experiments/autoencoder_architecture/experiment_runs_configs/segmentation_model/14_09_26_predictive_final/vpu_contractive_interaction.yaml
    status_directory: data/kidney_workspace/configs/entropy-runs/vpu-contractive-interaction-20260916-01/plan/status
    required: true
    role: candidate
    enabled: true
    include_labels:
      - "vpu_alpha_1_beta_1 (VariationalPULoss)"
  - name: vpu_contractive_interaction_expanded
    experiment_name: kidney-vpu-contractive-interaction-expanded
    experiment_config: assets/experiments/autoencoder_architecture/experiment_runs_configs/segmentation_model/14_09_26_predictive_final/vpu_contractive_interaction_expanded.yaml
    status_directory: data/kidney_workspace/configs/entropy-runs/vpu-contractive-interaction-expanded-20260917-01/plan/status
    required: true
    role: candidate
    enabled: true

# Stable analysis aliases are resolved against the joint inventory of every source.
# ``grid_id`` is the deterministic campaign cell identity; the campaign is only the
# locator needed to distinguish two independent runs with the same grid numbering.
# Tags are arbitrary analytical metadata, not conditions interpreted by precompute.
models:
  vpu:
    display_label: "vpu"
    select:
      source: vpu_precision_sweep
      grid_id: grid_0000
    tags:
      family: vpu
      contrastive: false
      contractive: false
    visualization:
      order: 0
      color: "#0072B2"
      line_style: solid
      marker: "o"

  vpu_contrastive:
    display_label: "vpu + contrastive"
    select:
      source: vpu_precision_sweep
      grid_id: grid_0005
    tags:
      family: vpu
      contrastive: true
      contractive: false
    visualization:
      order: 1
      color: "#56B4E9"
      line_style: dashed
      marker: "s"

  vpu_contractive:
    display_label: "vpu + contractive"
    select:
      source: vpu_contractive_interaction
      grid_id: grid_0000
    tags:
      family: vpu
      contrastive: false
      contractive: true
    visualization:
      order: 2
      color: "#D55E00"
      line_style: solid
      marker: "^"

  vpu_contractive_contrastive:
    display_label: "vpu + contractive + contrastive"
    select:
      source: vpu_contractive_interaction
      grid_id: grid_0001
    tags:
      family: vpu
      contrastive: true
      contractive: true
    visualization:
      order: 3
      color: "#E69F00"
      line_style: dashed
      marker: "D"

  vpu_contrastive_t001_w100m:
    display_label: "VPU + contrastive (T=0.01, w=0.1)"
    select: {source: vpu_contractive_interaction_expanded, grid_id: grid_0000}
    tags: {family: vpu, contrastive: true, contractive: false, temperature: 0.01, weight: 0.1}
    visualization: {order: 4, color: "#009E73", line_style: solid, marker: "o"}
  vpu_contractive_contrastive_t001_w100m:
